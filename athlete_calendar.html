<!doctype html>
<html lang="nl">
<head>
 <link rel="stylesheet" href="style.css?v=2">
 <script src="script.js" defer></script>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Athlos – calendar</title>
</head>
<div class="add-fab">
  <button type="button" class="add-btn" id="add-btn" aria-label="Add activity" aria-expanded="false" aria-controls="add-menu">+</button>
  <div class="add-menu" id="add-menu" role="group" aria-labelledby="add-title" hidden>
    <p class="add-title" id="add-title">Add activity</p>
    <button type="button" class="add-opt train" data-type="training">Training</button>
    <button type="button" class="add-opt race" data-type="race">Race</button>
    <button type="button" class="add-opt" data-type="note">Note</button>
  </div>
</div>
<a href="#" class="coach-btn" aria-label="Open AI coach">
 <span class="coach-icon">✦</span>
 <span>AI Coach</span>
</a>
<body>
 <div class="layout">
  <nav>
    <div class="logo">Athlos</div>
    <a href="athlete_dashboard.html">dashboard</a>
    <a href="athlete_planner.html">my planner</a>
    <a href="athlete_profile.html">profile</a>
    <a href="athlete_calendar.html" class="active">calendar</a>
    <a href="athlete_announcements.html">announcements</a>
    <a href="athlete_settings.html">settings</a>
    <a href="athlete_activities.html">activities</a>
    <a href="athlete_goals.html">goals</a>
  </nav>
  <main>
   <header>
    <div>
     <h1>calendar</h1>
    </div>
   </header>
   <section class="card calendar">
     <div class="cal-head">
       <h2 id="cal-title" aria-live="polite"></h2>
       <button type="button" class="btn" id="cal-today">Today</button>
       <button type="button" class="btn" id="cal-prev" aria-label="Previous month">‹</button>
       <button type="button" class="btn" id="cal-next" aria-label="Next month">›</button>
     </div>
     <div class="scroll">
       <div class="cal-grid" id="cal-grid"></div> 
     </div>
   </section>
  </main>
 </div>
</body>
</html>
